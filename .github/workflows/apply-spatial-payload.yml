name: Apply spatial psychoacoustic payload

on:
  push:
    branches:
      - agent/aigua-analysis-foundation
    paths:
      - ".github/spatial-payload-final/**"
      - ".github/workflows/apply-spatial-payload.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/aigua-analysis-foundation
          fetch-depth: 0

      - name: Decode, verify, and apply
        shell: bash
        run: |
          set -euo pipefail
          cat .github/spatial-payload-final/part-* > /tmp/spatial.patch.xz.b64
          base64 --decode /tmp/spatial.patch.xz.b64 > /tmp/spatial.patch.xz
          expected="$(tr -d '\n\r ' < .github/spatial-payload-final/sha256)"
          actual="$(sha256sum /tmp/spatial.patch.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          xz -dc /tmp/spatial.patch.xz > /tmp/spatial.patch
          git apply --check /tmp/spatial.patch
          git apply /tmp/spatial.patch
          rm -rf .github/spatial-payload .github/spatial-payload2 .github/spatial-payload-final
          rm -f .github/workflows/apply-spatial-payload.yml
          git diff --check
          python -m compileall -q mus_analysis examples tests
          node --check mus_analysis/spatial_canvas/app.js

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build psychoacoustic spatial canvas"
          git push origin HEAD:agent/aigua-analysis-foundation
