name: Ariadne next-phase research

on:
  push:
    branches:
      - agent/ariadne-next-phase
  pull_request:
    paths:
      - "mus-rs/crates/mus-watsn/**"
      - "mus-rs/Cargo.toml"
      - "mus-rs/Cargo.lock"
      - ".github/workflows/ariadne-next-phase.yml"

permissions:
  contents: read

jobs:
  law-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        working-directory: mus-rs
        run: cargo fmt --all -- --check

      - name: Unit and example tests
        working-directory: mus-rs
        run: cargo test -p mus-watsn --all-targets -- --nocapture

      - name: Clippy
        working-directory: mus-rs
        run: cargo clippy -p mus-watsn --all-targets -- -D warnings

      - name: Generate algebraic research artifacts
        working-directory: mus-rs
        run: cargo run -p mus-watsn --example next_phase --release -- /tmp/ariadne-next-phase/law

      - name: Generate changing-delay research artifacts
        working-directory: mus-rs
        run: cargo run -p mus-watsn --example string_retune --release -- /tmp/ariadne-next-phase/string

      - name: Verify scientific stop conditions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          law = json.loads(Path('/tmp/ariadne-next-phase/law/results.json').read_text())
          assert law['allpass']['max_neutral_abs_work'] <= 1e-12
          assert law['allpass']['max_legacy_abs_work'] >= 1e-2
          assert law['delay_remap']['max_neutral_relative_residual'] <= 1e-12
          assert law['delay_remap']['max_raw_energy_ratio_error'] >= 1e-2
          assert law['delay_remap']['hundred_cycle_max_abs_energy_drift'] <= 1e-10
          assert 0.95 <= law['delay_remap']['hundred_cycle_state_correlation'] < 0.99999
          assert law['commutator']['principal_angle_rad'] > 0.1
          assert law['factor_order']['exact_max_abs_difference'] > 1.0

          string = json.loads(Path('/tmp/ariadne-next-phase/string/results.json').read_text())
          assert string['sweep']['all_finite']
          assert string['sweep']['neutral_remap_max_abs_step_work'] <= 1e-9
          assert string['sweep']['neutral_filters_max_abs_filter_step_work'] <= 1e-10
          assert string['sweep']['legacy_max_abs_line_step_work'] >= 1e-8
          assert string['sweep']['legacy_max_abs_filter_step_work'] >= 1e-8
          assert string['sweep']['min_neutral_filters_correlation'] > 0.5
          assert string['sweep']['min_neutral_remap_correlation'] > 0.5

          print(json.dumps({'law': law, 'string': string}, indent=2, sort_keys=True))
          PY

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ariadne-next-phase
          path: /tmp/ariadne-next-phase
          if-no-files-found: error
