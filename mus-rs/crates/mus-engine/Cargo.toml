[package]
name = "mus-engine"
version = "0.1.0"
description = "Deterministic sampler render face for MUS ScoreGraphs"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hound = "3.5"
mus-graph = { path = "../mus-graph" }
mus-oplog = { path = "../mus-oplog" }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
mus-text = { path = "../mus-text" }
